name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The pages are prerendered with the latest price, so rebuild when the
  # dataset has a newer day. Checks hourly on weekdays, builds only on change.
  schedule:
    - cron: "17 * * * 1-5"

env:
  CURRENT_URL: https://raw.githubusercontent.com/MrSunshyne/mauritius-dataset-gold/main/data/current.json
  DEPLOYED_DATE_URL: https://gold.ramgolam.com/data-date.txt

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue instead of cancelling, so a scheduled check never cancels a deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - name: Compare the deployed data date with the dataset
        id: compare
        run: |
          latest=$(curl -sf "$CURRENT_URL" | jq -r .date)
          deployed=$(curl -sf "$DEPLOYED_DATE_URL" || true)
          echo "Dataset: $latest, deployed: ${deployed:-unknown}"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$latest" != "$deployed" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub disables scheduled workflows after 60 days without repository
      # activity; re-enabling through the API resets that
      - name: Keep the schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record the data date the site is built with
        run: curl -sf "$CURRENT_URL" | jq -r .date > public/data-date.txt

      - name: Generate static site
        run: pnpm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
